<title>Systems Under Load</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eef1f6;
    --surface:#ffffff;
    --surface-2:#f5f7fb;
    --ink:#1a2233;
    --muted:#5b6478;
    --line:#dbe0ea;
    --accent:#1c7a72;
    --accent-ink:#0d443f;
    --accent-soft:#e3f3f1;
    --good:#278a45;
    --good-soft:#e5f6ea;
    --bad:#c0392f;
    --bad-soft:#fbe9e7;
    --warn:#b5790a;
    --shadow: 0 1px 2px rgba(23,32,50,.06), 0 8px 24px -12px rgba(23,32,50,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d121c;
      --surface:#161d2b;
      --surface-2:#1c2436;
      --ink:#e9edf5;
      --muted:#8c96ab;
      --line:#2b3448;
      --accent:#54d6c9;
      --accent-ink:#c7f5ee;
      --accent-soft:#173330;
      --good:#5fd97a;
      --good-soft:#173424;
      --bad:#ff6b60;
      --bad-soft:#3a1c1c;
      --warn:#f0b862;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d121c;
    --surface:#161d2b;
    --surface-2:#1c2436;
    --ink:#e9edf5;
    --muted:#8c96ab;
    --line:#2b3448;
    --accent:#54d6c9;
    --accent-ink:#c7f5ee;
    --accent-soft:#173330;
    --good:#5fd97a;
    --good-soft:#173424;
    --bad:#ff6b60;
    --bad-soft:#3a1c1c;
    --warn:#f0b862;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .app{ width:100%; max-width:640px; }

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
  }
  .wordmark{
    font-family:'Sora', ui-sans-serif, sans-serif;
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:-0.01em;
  }
  .wordmark span{ color:var(--accent); }
  .subhead{
    font-size:.8rem;
    color:var(--muted);
    margin-top:2px;
  }

  .statbar{
    display:flex;
    gap:10px;
  }
  .chip{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 11px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .chip b{ color:var(--ink); font-weight:600; }
  .chip.score b{ color:var(--accent-ink); }
  .chip.setpicker{ padding:0; overflow:hidden; }
  .chip.setpicker select{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--ink);
    background:transparent;
    border:none;
    padding:5px 11px;
    cursor:pointer;
  }
  .chip.setpicker select:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .difficulty{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 9px;
    margin:0 0 14px 8px;
  }
  .error{
    padding:16px;
    color:var(--bad);
    font-size:.9rem;
  }

  /* progress track */
  .track{
    display:flex;
    align-items:center;
    margin:0 0 22px;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow-x:auto;
  }
  .node-row{ display:flex; align-items:center; flex:1; min-width:0; }
  .node{
    width:22px; height:22px; min-width:22px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:.62rem;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    transition:all .25s ease;
  }
  .node:hover{ border-color:var(--accent); }
  .node:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .node.current{ border-color:var(--accent); color:var(--accent-ink); box-shadow:0 0 0 4px var(--accent-soft); }
  .node.correct{ border-color:var(--good); background:var(--good); color:#fff; }
  .node.incorrect{ border-color:var(--bad); background:var(--bad); color:#fff; }
  .wire{
    flex:1;
    height:2px;
    background:var(--line);
    min-width:8px;
  }
  .wire.done{ background:var(--accent); }

  /* card */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:26px 26px 24px;
  }
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-ink);
    background:var(--accent-soft);
    border-radius:6px;
    padding:4px 9px;
    margin-bottom:14px;
  }
  .scenario{
    font-size:.95rem;
    line-height:1.6;
    color:var(--muted);
    padding-left:14px;
    border-left:3px solid var(--line);
    margin-bottom:18px;
  }
  .question{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.45;
    text-wrap:balance;
    margin-bottom:18px;
  }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:inherit;
    font-size:.92rem;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); }
  .option:active:not(:disabled){ transform:scale(.997); }
  .option:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .option:disabled{ cursor:default; }

  .letter{
    width:26px; height:26px; min-width:26px;
    border-radius:50%;
    background:var(--surface);
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:.78rem;
    color:var(--muted);
  }
  .option-text{ flex:1; line-height:1.4; }
  .mark{ font-size:1.05rem; font-weight:700; min-width:18px; text-align:center; }

  .option.is-correct{ border-color:var(--good); background:var(--good-soft); }
  .option.is-correct .letter{ border-color:var(--good); background:var(--good); color:#fff; }
  .option.is-correct .mark{ color:var(--good); }

  .option.is-wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .option.is-wrong .letter{ border-color:var(--bad); background:var(--bad); color:#fff; }
  .option.is-wrong .mark{ color:var(--bad); }

  .explain{
    margin-top:18px;
    padding:16px 16px 15px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    animation:rise .25s ease;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .explain-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.1em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .explain.right .explain-label{ color:var(--good); }
  .explain.wrong .explain-label{ color:var(--bad); }
  .explain p{ margin:0; font-size:.9rem; line-height:1.6; color:var(--ink); }

  .actions{ display:flex; justify-content:flex-end; margin-top:20px; }
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:.9rem;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:10px;
    padding:11px 20px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn.ghost{
    background:transparent;
    color:var(--accent-ink);
    border:1.5px solid var(--accent);
  }

  /* results */
  .results-score{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:3rem;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .results-score span{ font-size:1.4rem; color:var(--muted); font-weight:600; }
  .results-line{ color:var(--muted); font-size:.9rem; margin-top:6px; margin-bottom:20px; }
  .breakdown{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .brow{
    display:flex; align-items:center; gap:10px;
    font-size:.86rem;
    padding:9px 12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .brow .mark{ font-size:.95rem; }
  .brow .tagname{ font-family:'IBM Plex Mono', monospace; font-size:.75rem; color:var(--muted); flex:1; }

  @media (prefers-reduced-motion: reduce){
    .explain{ animation:none; }
    .option, .btn{ transition:none; }
  }

  @media (max-width:420px){
    .card{ padding:20px 18px; }
    .question{ font-size:1.05rem; }
  }
</style>

<div class="app">
  <div class="masthead">
    <div>
      <div class="wordmark">Systems <span>Under Load</span></div>
      <div class="subhead">A scenario-driven system design quiz</div>
    </div>
    <div class="statbar">
      <div class="chip setpicker">
        <select id="setSelect" aria-label="Question set"></select>
      </div>
      <div class="chip score" id="scoreChip">Score <b id="scoreVal">0/10</b></div>
    </div>
  </div>

  <div class="track" id="track"></div>

  <div class="card" id="card"></div>
</div>

<script>
const SET_MANIFEST = [
  { id: "set0", label: "Set 0", file: "sets/set0.json" },
  { id: "set1", label: "Set 1", file: "sets/set1.json" },
  { id: "set2", label: "Set 2", file: "sets/set2.json" },
  { id: "set3", label: "Set 3", file: "sets/set3.json" },
  { id: "set4", label: "Set 4", file: "sets/set4.json" },
  { id: "set5", label: "Set 5", file: "sets/set5.json" },
  { id: "set6", label: "Set 6", file: "sets/set6.json" },
];
const LAST_SET_KEY = "sdq-last-set";

let QUESTIONS = [];
let idx = 0;
let score = 0;
let answered = [];
let selected = [];
let locked = false;

const trackEl = document.getElementById('track');
const cardEl = document.getElementById('card');
const scoreVal = document.getElementById('scoreVal');
const setSelect = document.getElementById('setSelect');

SET_MANIFEST.forEach(set => {
  const opt = document.createElement('option');
  opt.value = set.id;
  opt.textContent = set.label;
  setSelect.appendChild(opt);
});

async function loadSet(setId){
  const set = SET_MANIFEST.find(s => s.id === setId) || SET_MANIFEST[0];
  setSelect.value = set.id;
  try {
    const res = await fetch(set.file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    QUESTIONS = await res.json();
  } catch (err) {
    cardEl.innerHTML = `<div class="error">Couldn't load "${set.label}" (${err.message}). Make sure you're serving this folder over http:// (not opening the file directly), and that ${set.file} exists.</div>`;
    QUESTIONS = [];
    trackEl.innerHTML = '';
    scoreVal.textContent = '0/0';
    return;
  }
  localStorage.setItem(LAST_SET_KEY, set.id);
  idx = 0; score = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  selected = new Array(QUESTIONS.length).fill(null);
  renderTrack(); renderScore(); renderQuestion();
}

setSelect.addEventListener('change', () => loadSet(setSelect.value));

function renderTrack(){
  let html = '<div class="node-row">';
  QUESTIONS.forEach((q,i)=>{
    let cls = 'node';
    if (answered[i] === true) cls += ' correct';
    else if (answered[i] === false) cls += ' incorrect';
    else if (i === idx) cls += ' current';
    html += `<div class="${cls}" data-i="${i}" role="button" tabindex="0" title="Jump to: ${q.tag}">${i+1}</div>`;
    if (i < QUESTIONS.length - 1){
      const done = answered[i] !== null;
      html += `<div class="wire${done ? ' done' : ''}"></div>`;
    }
  });
  html += '</div>';
  trackEl.innerHTML = html;

  trackEl.querySelectorAll('.node').forEach(node=>{
    node.addEventListener('click', ()=>goToQuestion(parseInt(node.dataset.i,10)));
    node.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        goToQuestion(parseInt(node.dataset.i,10));
      }
    });
  });
}

function goToQuestion(i){
  if (i === idx) return;
  idx = i;
  renderTrack();
  renderQuestion();
}

function renderScore(){
  scoreVal.textContent = `${score}/${QUESTIONS.length}`;
}

function renderQuestion(){
  locked = false;
  const q = QUESTIONS[idx];
  let optsHtml = '';
  q.options.forEach((opt,i)=>{
    const letter = String.fromCharCode(65+i);
    optsHtml += `<button class="option" data-i="${i}">
      <span class="letter">${letter}</span>
      <span class="option-text">${opt}</span>
      <span class="mark"></span>
    </button>`;
  });

  cardEl.innerHTML = `
    <div class="tag">${q.tag}</div>${q.difficulty ? `<span class="difficulty">${q.difficulty}</span>` : ''}
    <div class="scenario">${q.scenario}</div>
    <div class="question">${q.question}</div>
    <div class="options" id="options">${optsHtml}</div>
    <div id="explainSlot"></div>
  `;

  if (selected[idx] !== null){
    locked = true;
    showAnswerState(selected[idx], answered[idx]);
  } else {
    document.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>selectOption(parseInt(btn.dataset.i,10)));
    });
  }
}

function selectOption(i){
  if (locked) return;
  locked = true;
  const q = QUESTIONS[idx];
  const correct = i === q.correctIndex;
  answered[idx] = correct;
  selected[idx] = i;
  if (correct) score++;

  showAnswerState(i, correct);
  renderTrack();
  renderScore();
}

function showAnswerState(i, correct){
  const q = QUESTIONS[idx];
  document.querySelectorAll('.option').forEach((btn, bi)=>{
    btn.disabled = true;
    if (bi === q.correctIndex){
      btn.classList.add('is-correct');
      btn.querySelector('.mark').textContent = '✓';
    } else if (bi === i){
      btn.classList.add('is-wrong');
      btn.querySelector('.mark').textContent = '✗';
    }
  });

  const slot = document.getElementById('explainSlot');
  slot.innerHTML = `
    <div class="explain ${correct ? 'right' : 'wrong'}">
      <div class="explain-label">${correct ? 'CORRECT — WHY' : 'NOT QUITE — WHY'}</div>
      <p>${q.explanation}</p>
    </div>
    <div class="actions">
      <button class="btn" id="nextBtn">${idx === QUESTIONS.length - 1 ? 'See results' : 'Next question'}</button>
    </div>
  `;
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if (idx === QUESTIONS.length - 1) renderResults();
    else { idx++; renderTrack(); renderQuestion(); }
  });
}

function renderResults(){
  renderTrack();
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let verdict;
  if (pct === 100) verdict = "Clean sweep — you've got a solid handle on these fundamentals.";
  else if (pct >= 70) verdict = "Strong run — a couple of gaps worth a second look.";
  else if (pct >= 40) verdict = "Decent start — these trade-offs take repetition to stick.";
  else verdict = "Good baseline to build from — worth another pass.";

  let rowsHtml = '';
  QUESTIONS.forEach((q,i)=>{
    const ok = answered[i];
    rowsHtml += `<div class="brow">
      <span class="mark" style="color:${ok ? 'var(--good)' : 'var(--bad)'}">${ok ? '✓' : '✗'}</span>
      <span class="tagname">${q.tag}</span>
    </div>`;
  });

  cardEl.innerHTML = `
    <div class="tag">Results</div>
    <div class="results-score">${score}<span>/${QUESTIONS.length}</span></div>
    <div class="results-line">${verdict}</div>
    <div class="breakdown">${rowsHtml}</div>
    <div class="actions">
      <button class="btn ghost" id="restartBtn">Restart quiz</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
}

function restart(){
  idx = 0; score = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  selected = new Array(QUESTIONS.length).fill(null);
  renderTrack(); renderScore(); renderQuestion();
}

const initialSet = SET_MANIFEST.find(s => s.id === localStorage.getItem(LAST_SET_KEY)) || SET_MANIFEST[0];
loadSet(initialSet.id);
</script>
