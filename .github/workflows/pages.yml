# Publishes system-design-quiz/ to https://kaushik912.github.io/misc/
# Only that folder is deployed; the rest of the repo is not served.
name: Deploy Pages

on:
  push:
    branches: [master]
    paths: ["system-design-quiz/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r system-design-quiz/quiz.html system-design-quiz/sets _site/
          cp system-design-quiz/quiz.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
